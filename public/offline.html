<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem ligação | GARCEA</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #1a1a1a;
        text-align: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0c0f16; color: #f1f1f1; }
      }
      img { width: 96px; height: 96px; border-radius: 50%; background: #fff; }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 1.5rem; opacity: 0.8; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 0.7rem 1.4rem;
        background: #0340d8;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem ligação à internet</h1>
      <p>Verifique a ligação e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
